name: Compilar APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generar andamiaje Android
        run: |
          flutter create --platforms=android --org com.luis --project-name obd_libre _tmp
          cp -r _tmp/android ./android
          rm -rf _tmp
          mkdir -p android/app/src/main/kotlin/com/luis/obd_libre
          cp overlay/MainActivity.kt android/app/src/main/kotlin/com/luis/obd_libre/MainActivity.kt
          python3 tools/patch_manifest.py
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: OBD-Libre-APK
          path: build/app/outputs/flutter-apk/app-release.apk
